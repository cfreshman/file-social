<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="/helpers.js"></script>
  <script src="/css.js"></script>
  <script src="/hydrate.js"></script>
  <title>[=]</title>

  <link rel="icon" href="">
  <link rel="apple-touch-icon-precomposed" href="">
  <meta property="og:image" content="">
  <meta property="og:title" content="">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:image" content="">
  <style>
    :root {
      /* --background: #f9f8f6; */
      --background: rgb(238, 235, 230);
      --color: #101010;
    }
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
    }
    html {
      background: var(--background);
      color: var(--color);
      font-size: 14px;
    }
    body {
      font-family: SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono","Courier New",monospace;
      padding: .5rem 1rem;
      overflow-x: visible;
    }
    a {
      color: inherit;
      text-decoration: underline;
      cursor: pointer;
    }
    #bottom {
      position: fixed;
      bottom: .5em;
      right: .5em;
      text-decoration: none;
      font-size: .9em;
      padding: .15em .3em;
      border: 1px solid var(--color);
      border-radius: 2px;
      opacity: .3;
      text-transform: uppercase;

      display: none;
    }
    #bottom::after {
      content: " →";
    }

    :root {--button:#eee;}button,a,input,*[onclick]{font-family:inherit;font-size:max(1em, 12px);cursor:pointer;touch-action:manipulation;}button,input:is(:not([type]),[type=text],[type=password],[type=email]){border:1px solid currentColor;border-radius:10em;padding:.1667em.67em;height:calc(100%-1px);margin:.5px 0;}button{background:var(--button);user-select:none;}
  </style>

</head>
<body>
    <script>
      const log = named_log('file-social')
      
      // Constants
      const METADATA_PREFIX = '-'
      const COMMENT_PREFIX = '//'
      
      {
      const query_keys = set(',', ',')
      const query = new URLSearchParams(location.search)
      list(query.keys()).filter(k => !query_keys.has(k) && query.delete(k))
      const item = query.get('')?.split('?')[0] || ''
      query.set('', item)
      const queryString = item ? '?' + query.toString() : ''
      url.replace(location.origin + location.pathname + queryString + location.hash)
    }
  </script>

  <div id="floater" class="row gap" style="
  display: none;
  position: fixed;
  top: 2px; right: 2px;
  z-index: 100100100;
  filter: var(--filter);
  ">
    <button onclick="
    const item = location.search.slice(2).split('.')[0].replace(/\//g, '-')
    Q(`#item-${item}`)?.scrollIntoView({ block: 'start' })
    ">jump to selected</button>
    <button onclick="
    url.replace(location.pathname)
    Q('#floater').style.display = 'none'
    QQ('.label.hidden').map(x => x.style.display = 'none')
    document.title = '[≋]'
    ">deselect</button>
    <button onclick="
    copy(location.href)
    display_status(event.target, 'copied!')
    ">copy link</button>
  </div>

  <div style="display:flex;flex-direction:column;width:100%;max-width:min(800px, 100vw);margin:0 auto;align-items:center;padding:0;box-sizing:border-box;">
    <div id="list">
    </div>
    <button style="
    position: sticky;
    bottom: .5em; margin-top: 100vh;
    z-index: 1;
    transform: translate3d(0,0,0);
    " onclick="
    event.preventDefault()
    Q('#list').scrollIntoView({block:'start'})
    ">scroll to top</button>
    <style>
      body {
        min-height: 200vh;
        padding-bottom: 67vh;
      }
      #list {
        display: flex; flex-direction: column;
        width: 100%;
      }
      #list::before {
        order: 0;
        content: "^PINNED";
      }
      #list > .item {
        position: relative;
        padding-top: 1em;
        width: 100%;
        max-height: max(100vw, 200vh);
        max-width: 100%;
        overflow: hidden;
        box-sizing: border-box;
      }
      #list > .item > .content {
        white-space: pre-wrap;
        background: white;
        color: black;
        padding: .5em 1em;
        padding-bottom: 2.5em;
        font-size: .8em;
      }
      #list > .item > .content.render-target {
        min-height: 15em;
        min-width: min(50em, calc(100vw - 1em));
        background: white;
      }
      #list > .item > .label {
        /* font-size: .6em; */
        font-size: .8em;
        text-align: right;

        position: absolute; bottom: 0; right: 0;
        margin: .25em;
        color: white;
        /* mix-blend-mode: difference; */
      }
      #list > .item > .label::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        height: 100%; width: 100%;
        background: #000;
        color: var(--background);
      }
      #list > .item a {
        text-decoration: none;
        mix-blend-mode: difference;
      }
      #list > .item > :first-child {
        width: 100%;
        max-width: 100%;
        border: 1px solid var(--color);
        display: flex;
        max-height: calc(100vh - 1em);
      }
      #list > .item img,
      #list > .item video {
        max-width: 100%;
        width: 100%;
        height: auto;
      }
      #list > .item iframe {
        max-width: 100%;
        width: 100%;
      }
      #list > .item > .palette {
        position: absolute;
        top: 0; left: 100%; margin: 0 .5em;
      }
      #list.best-only > .item:not(.best) {
        display: none;
      }
    </style>
    <script>
      const has_search = location.search.slice(2)
      Q('#floater').style.display = has_search && !devices.is_mobile ? '' : 'none'

      const scrollToItem = window['scrollToItem'] = (item=new URLSearchParams(location.search).get('')?.split('?')[0]) => {
        if (item) {
          const id = `item-${item.split('.')[0].replace(/\//g, '-')}`
          const element = document.querySelector(`#${id}`)
          if (element) {
            element.scrollIntoView({ block: 'start' })
          }
        }
      }

      {
        const list = Q('#list')
        const item = new URLSearchParams(location.search).get('')?.split('?')[0]
        Promise.all([
          fetch('/api/posts')
          .then(res => res.json())
          .then(data => data.posts.map(p => p.path)),
          fetch('/config/-pins')
          .then(res => res.text())
          .then(text => (x => [x, new Set(x)])(text.split('\n').filter(x => x && !x.startsWith(COMMENT_PREFIX))))
          .catch(e => undefined),
          fetch('/config/-best')
          .then(res => res.text())
          .then(text => (x => [x, new Set(x)])(text.split('\n').filter(x => x && !x.startsWith(COMMENT_PREFIX))))
          .catch(e => undefined),
          fetch('/config/-backdrop')
          .then(res => res.text())
          .then(text => text.split('\n').filter(x => x && !x.startsWith(COMMENT_PREFIX) && x.trim())[0])
          .catch(e => undefined),
        ])
        .then(async ([files, pins=[[], new Set()], best=[[], new Set()], backdrop]) => {
          console.debug('render file-social', {files, pins, best, backdrop})
          
          // Set backdrop if provided
          if (backdrop) {
            const ext = backdrop.split('.').pop().toLowerCase()
            const BACKDROP_OPACITY = 0.5
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
              const img = document.createElement('img')
              img.src = backdrop
              img.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: ${BACKDROP_OPACITY}; image-rendering: pixelated;`
              document.body.prepend(img)
            } else if (['mp4', 'webm'].includes(ext)) {
              const video = document.createElement('video')
              video.src = backdrop
              video.autoplay = true
              video.loop = true
              video.muted = true
              video.style.cssText = `position: fixed; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1; opacity: ${BACKDROP_OPACITY}; image-rendering: pixelated;`
              document.body.prepend(video)
            }
          }

          const renders = {}
          list.innerHTML += files
            .filter(file => !file.startsWith(METADATA_PREFIX))
            .map(file => {
              const path = `/posts/${file}`
              // Extract name and extension, handling files without extensions
              const lastDotIndex = file.lastIndexOf('.')
              const lastSlashIndex = file.lastIndexOf('/')
              const hasExtension = lastDotIndex > lastSlashIndex && lastDotIndex > 0
              const extension = hasExtension ? file.substring(lastDotIndex) : ''
              const name = hasExtension ? file.substring(0, lastDotIndex) : file

              switch (extension.toLowerCase()) {
                case '.url':
                  // Load URL from file and determine how to render it
                  const urlContentId = `url-content-${name.replace(/[^a-zA-Z0-9]/g, '-')}`
                  return {
                    id: urlContentId,
                    fetcher: async () => {
                      const response = await fetch(path)
                      const url = (await response.text()).trim()
                      const urlExt = url.substring(url.lastIndexOf('.')).toLowerCase().split('?')[0]
                      
                      if (['.png', '.jpg', '.jpeg', '.gif', '.webp'].includes(urlExt)) {
                        return `<div style="background: white; padding: .5em; width: 100%; box-sizing: border-box; display: flex; justify-content: flex-start;"><img src="${url}" style="max-height: 400px; max-width: 100%; width: auto; height: auto; object-fit: contain;" /></div>`
                      } else if (['.mp4', '.webm'].includes(urlExt)) {
                        return `<div style="background: white; padding: .5em; width: 100%; box-sizing: border-box; display: flex; justify-content: flex-start;"><video src="${url}" controls loop muted autoplay style="max-height: 400px; max-width: 100%; width: auto; height: auto; object-fit: contain;"></video></div>`
                      } else {
                        // Treat as HTML content - use same rendering as .html files
                        return `<div style="background: white; min-height: 15em;"><iframe src="${url}" style="width: 100%; height: 500px; border: none;" onload="
                        const L = event.target
                        let prev_height = undefined
                        const resize = () => {
                          try {
                            L.height = L.contentWindow.document.documentElement.scrollHeight / 2
                            L.height = L.contentWindow.document.documentElement.scrollHeight + 8 + 16
                          } catch(e) {
                            // Cross-origin iframe, can't resize. Keep default height.
                            return false
                          }
                          const changed = L.height !== prev_height
                          prev_height = L.height
                          return changed
                        }
                        const resize_loop = () => {
                          if (resize()) resize_loop()
                          else setTimeout(() => requestAnimationFrame(resize_loop), 1_000)
                        }
                        resize_loop()

                        try {
                          if (!L.contentWindow.window.location.pathname.includes('/raw')) {
                            defer(() => {
                              L.style.minHeight = 0
                              L.style.minHeight = \`max(100px, \${(L.contentWindow.window.document.body.querySelector('.body')?.scrollHeight||0)+'px'});\`
                            }, 1_000)
                          }
                        } catch {}
                        "></iframe></div>`
                      }
                    }
                  }
                case '.png': case '.jpg': case '.jpeg': case '.gif': case '.webp':
                  return `<div style="background: white; padding: .5em; width: 100%; box-sizing: border-box; display: flex; justify-content: flex-start;"><img src="${path}" style="max-height: 400px; max-width: 100%; width: auto; height: auto; object-fit: contain;" /></div>`
                case '.mp4': case '.webm':
                  return `<div style="background: white; padding: .5em; width: 100%; box-sizing: border-box; display: flex; justify-content: flex-start;"><video src="${path}" controls loop muted autoplay style="max-height: 400px; max-width: 100%; width: auto; height: auto; object-fit: contain;"></video></div>`
                case '.html': case '.htm': case '.href.txt': case '.txt': case '.md': 
                  return `<iframe src="${path}" onload="
                  const L = event.target
                  let prev_height = undefined
                  const resize = () => {
                    L.height = L.contentWindow.document.documentElement.scrollHeight / 2
                    L.height = L.contentWindow.document.documentElement.scrollHeight + 8 + 16
                    const changed = L.height !== prev_height
                    prev_height = L.height
                    return changed
                  }
                  const resize_loop = () => {
                    if (resize()) resize_loop()
                    else setTimeout(() => requestAnimationFrame(resize_loop), 1_000)
                  }
                  requestAnimationFrame(() => requestAnimationFrame(resize_loop))

                  if ('${file}' === location.search.slice(2)) {
                    window['scrollToItem']()
                  }

                  try {
                    if (L.src === L.contentWindow.window.location.href && ${extension === '.href.txt'}) {
                      L.contentWindow.window.location.href = L.contentWindow.window.document.body.textContent
                    } else if (!L.contentWindow.window.location.pathname.includes('/raw')) {
                      defer(() => {
                        L.style.minHeight = 0
                        L.style.minHeight = \`max(100px, \${(L.contentWindow.window.document.body.querySelector('.body')?.scrollHeight||0)+'px'});\`
                      }, 1_000)
                    }
                    
                  } catch {}
                  "></iframe>`
                default:
                  // For unknown file types, load as text
                  const contentId = `content-${name.replace(/[^a-zA-Z0-9]/g, '-')}`
                  // Store fetcher for lazy loading
                  return {
                    html: `<div class='content' id="${contentId}" style="white-space: pre-wrap;">[loading...]</div>`,
                    load: async () => {
                      try {
                        const res = await fetch(path)
                        const text = await res.text()
                        const el = document.getElementById(contentId)
                        if (el) el.textContent = text
                      } catch (e) {
                        const el = document.getElementById(contentId)
                        if (el) el.textContent = '[error loading file]'
                      }
                    }
                  }
              }
            })
            .map((render, i) => {
              const encoded = files[i]
              const name = decodeURIComponent(encoded)
              const socials = (window['stream-item-socials'] || {})[name]

              const id = `item-${encoded.split('.')[0].replace(/\//g, '-')}`
              const pinned = pins[1].has(name)
              const is_best = best[1].has(name)||pins[1].has(name)
              is_best && log({name,is_best,pinned})
              let load_on_scroll_into_view
              
              // Handle object return (text files and .url files with lazy loader)
              if (typeof render === 'object' && (render.html || render.fetcher)) {
                renders[id] = render
                if (pinned) {
                  if (render.html) {
                    load_on_scroll_into_view = render.html
                    render.load() // Load immediately for pinned
                  } else if (render.fetcher) {
                    // For .url files, load immediately if pinned
                    load_on_scroll_into_view = `<div class='render-target content'></div>`
                    render.fetcher().then(html => {
                      const target = Q(`#${id} .render-target`)
                      if (target) target.outerHTML = html
                    })
                  }
                } else {
                  load_on_scroll_into_view = `<div class='render-target content'></div>`
                }
              } else if (pinned) {
                load_on_scroll_into_view = render
              } else {
                renders[id] = render
                load_on_scroll_into_view = `<div class='render-target content'></div>`
              }
              
              return `
            <div class="item ${is_best?'best':''}" id="${id}" style="
            order: ${pinned ? -(pins[0].length - pins[0].indexOf(encoded)) : i};
            ${pinned ? `
            margin-top: calc(-1em - 1px) !important;
            ` : ''}
            ">
              ${name.includes('rated-R')
              ? `<div style="
              background: #fff;
              ">
                <button style="
                margin: .5em 1em;
                cursor: pointer;
                " onclick="
                console.debug(event)
                event.target.parentNode.parentNode.prepend(event.target.nextElementSibling.children[0])
                event.target.parentNode.remove()
                ">RATED R</button>
                <div style="display:none">
                  ${load_on_scroll_into_view}
                </div>
              </div>`
              : load_on_scroll_into_view}
              ${
                `<div class="label hidden" style="
                bottom: 1.5em;
                ${item === name ? '' : 'display: none;'}
                "><a target="_blank" href="${location.origin}/posts/${name}">new tab ↗</a></div>`
              }
              <div class="label">${
                `<a href="?=${encoded}" onclick="
                const e = event
                const { currentTarget:l } = e
                if (!e.metaKey) {
                  e.preventDefault()
                  const currentSearch = location.search || '?='
                  const show_new_tab = !l.href.endsWith(currentSearch)
                  url.replace(show_new_tab ? l.href : location.pathname)
                  let item = l
                  while (item && !item.classList?.contains('item')) {
                    item = item.parentNode
                  }

                  document.title = '[≋]'
                  QQ('.label.hidden').map(x => x.style.display = 'none')

                  if (show_new_tab) {
                    QQ(item, '.label').map(x => x.style.display = 'unset')
                    document.title = '${name}'
                    Q('#floater').style.display = ''
                  } else {
                    Q('#floater').style.display = 'none'
                  }
                }
                ">${name}</a>`
              }</div>
              ${
                socials ? `<div class=row style="
                position: absolute;
                bottom: 0; left: 0; margin: 2px;
                ">${
                  socials.map(([object, args]) => object.render(...args.render)).map(x => `<div class=label style="
                  color: #fff; height: 1em;
                  ">${x}</div>`).join('')
                }</div>` : ''
              }
            </div>`
            })
            .join('\n')

          let unloaded = QQ(list, '.item:has(.render-target)')
          let scroll_in_progress = 0
          let user_scroll = false
          let start_ms = performance.now()
          const handleScroll = window['handleScroll'] = (force=false) => {
            if (scroll_in_progress) return
            if (performance.now() - start_ms > 250) user_scroll = true
            try {
              scroll_in_progress = 1
              
              // Load items coming into view
              unloaded = unloaded.slice().reverse().filter(l => {
                const rect = l.getBoundingClientRect()
                if (force || (0 <= rect.y + rect.height + innerHeight && rect.y - innerHeight <= innerHeight)) {
                  const render_target = Q(l, '.render-target')
                  const renderData = renders[l.id]
                  
                  try {
                    // Handle object with html and load function (text files)
                    if (typeof renderData === 'object' && renderData.html) {
                      render_target.outerHTML = renderData.html
                      renderData.load()
                    } else if (typeof renderData === 'object' && renderData.fetcher) {
                      // Handle .url files with async fetcher
                      renderData.fetcher().then(html => {
                        render_target.outerHTML = html
                      })
                    } else {
                      render_target.outerHTML = renderData
                    }
                  } catch {}
                  delete renders[l.id]
                  return false
                } else {
                  return true
                }
              })
              
              // Unload/reload iframes based on viewport distance
              QQ(list, '.item iframe').forEach(iframe => {
                const rect = iframe.getBoundingClientRect()
                const tooFarAbove = rect.bottom < -innerHeight * 2
                const tooFarBelow = rect.top > innerHeight * 3
                const shouldUnload = tooFarAbove || tooFarBelow
                
                if (shouldUnload && iframe.src) {
                  // Save the original src and height before unloading
                  if (!iframe.dataset.originalSrc) {
                    iframe.dataset.originalSrc = iframe.src
                  }
                  iframe.style.height = iframe.offsetHeight + 'px'
                  iframe.removeAttribute('src')
                } else if (!shouldUnload && !iframe.src && iframe.dataset.originalSrc) {
                  // Reload iframe when scrolling back into range
                  iframe.src = iframe.dataset.originalSrc
                  // Clear fixed height after iframe loads
                  iframe.addEventListener('load', function clearHeight() {
                    iframe.style.height = ''
                    iframe.removeEventListener('load', clearHeight)
                  }, { once: true })
                }
              })
            } catch {} finally {
              scroll_in_progress = 0
            }
          }
          on(window, 'scroll click', () => handleScroll())
          handleScroll()
          scrollToItem()

          // Set up iframe event listeners (for both immediate and lazy-loaded iframes)
          const setupIframeLinks = (frame) => {
            frame.addEventListener('load', () => {
              try {
                const links = Array.from(frame.contentWindow.window.document.querySelectorAll('a[href]'))
                links.map(link => link.addEventListener('click', e => {
                  if (!link.href.startsWith(location.origin)) {
                    e.preventDefault()
                    e.stopPropagation()
                    window.open(link.href, '_blank')
                  }
                }))
              } catch {}
            })
          }
          
          // Set up existing iframes (pinned items)
          Array.from(list.querySelectorAll('iframe')).forEach(setupIframeLinks)
          
          // Set up MutationObserver to handle lazy-loaded iframes
          const iframeObserver = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              mutation.addedNodes.forEach((node) => {
                if (node.nodeName === 'IFRAME') {
                  setupIframeLinks(node)
                }
              })
            })
          })
          iframeObserver.observe(list, { childList: true, subtree: true })
          
          // Keyboard navigation
          on(window, 'keydown', (e) => {
            const items = QQ('#list > .item')
            if (!items.length) return
            
            // Find currently visible item (closest to viewport center)
            const viewportCenter = window.innerHeight / 2
            let currentIndex = 0
            let minDistance = Infinity
            
            items.forEach((item, index) => {
              const rect = item.getBoundingClientRect()
              const itemCenter = rect.top + rect.height / 2
              const distance = Math.abs(itemCenter - viewportCenter)
              if (distance < minDistance) {
                minDistance = distance
                currentIndex = index
              }
            })
            
            // Navigate with arrow keys
            if (e.key === 'ArrowDown' || e.key === 'j') {
              e.preventDefault()
              const nextIndex = Math.min(currentIndex + 1, items.length - 1)
              items[nextIndex]?.scrollIntoView({ behavior: 'smooth', block: 'start' })
            } else if (e.key === 'ArrowUp' || e.key === 'k') {
              e.preventDefault()
              const prevIndex = Math.max(currentIndex - 1, 0)
              items[prevIndex]?.scrollIntoView({ behavior: 'smooth', block: 'start' })
            } else if (e.key === 'Home') {
              e.preventDefault()
              items[0]?.scrollIntoView({ behavior: 'smooth', block: 'start' })
            } else if (e.key === 'End') {
              e.preventDefault()
              items[items.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' })
            }
          })
        })

      }
    </script>

    <a id="bottom" href="https://freshman.dev">freshman.dev</a>
  </div>

</body>
</html>
