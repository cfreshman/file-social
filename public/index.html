<!DOCTYPE html>
<html>
<head>
  <meta charset=utf-8><script src="/lib.js"></script><meta data-hydrate data-style />
  <title>file-social</title>

  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.3.0/model-viewer.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <link rel="icon" href="/icon.jpg">
  <link rel="apple-touch-icon" href="/icon.jpg">
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#eee5e6">
  <meta property="og:title" content="file-social">
  <meta property="og:description" content="unsocial media stream">
  <meta property="og:image" content="/icon.jpg">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="file-social">
  <meta name="twitter:description" content="unsocial media stream">
  <meta name="twitter:image" content="/icon.jpg">
  <style>
    :root {
      /* --background: #f9f8f6; */
      /* --background: rgb(238, 235, 230); */
      --background: #eee5e6;
      --color: #101010;
    }
    html {
      background: var(--background);
      color: var(--color);
      font-size: 14px;
    }
  </style>

</head>
<body>
  <script>
      const log = named_log('file-social')
      
      // Constants
      const METADATA_PREFIX = '-'
      const COMMENT_PREFIX = '//'
  </script>

  <div id="floater" class="row gap" style="
  display: none;
  position: fixed;
  top: 2px; right: 2px;
  z-index: 100100100;
  filter: var(--filter);
  ">
    <button onclick="
    window['scrollToItem']()
    ">jump to selection</button>
    <button onclick="
    setUrlParams({}, { unset: [''] })
    Q('#floater').style.display = 'none'
    QQ('.label.hidden').map(x => x.style.display = 'none')
    document.title = 'file-social'
    ">deselect</button>
    <button onclick="
    copy(location.href)
    display_status(event.target, 'copied!')
    ">copy link</button>
  </div>

  <div style="display:flex;flex-direction:column;width:100%;max-width:min(800px, 100vw);margin:0 auto;align-items:center;padding:0;box-sizing:border-box;">
    <div id="list">
    </div>
    <button style="
    position: sticky;
    bottom: .5em; margin-top: 100vh;
    z-index: 100100100;
    transform: translate3d(0,0,0);
    " onclick="
    event.preventDefault()
    window.scrollTo({top: 0, behavior: 'instant'})
    ">scroll to top</button>
    <style>
      body {
        min-height: 200vh;
        padding-bottom: 67vh;
      }
      #list {
        display: flex; flex-direction: column;
        width: 100%;
      }
      #list-header {
        order: 0;
        display: flex;
        align-items: center;
        gap: 0.5em;
        margin-top: 0.25em;
      }
      #list-header button.active {
        opacity: 1;
        background: black;
        color: white;
        border-color: black;
        transform: translateY(1px);
      }
      #list > .item {
        position: relative;
        padding-top: 1em;
        width: 100%;
        max-height: max(100vw, 200vh);
        max-width: 100%;
        overflow: hidden;
        box-sizing: border-box;
      }
      #list > .item > .content {
        white-space: pre-wrap;
        background: white;
        color: black;
        padding: .5em;
        padding-bottom: 2.5em;
        font-size: .8em;
      }
      #list > .item > .content.render-target {
        min-height: 15em;
        min-width: min(50em, calc(100vw - 1em));
        background: white;
      }
      #list > .item > .label {
        /* font-size: .6em; */
        font-size: .8em;
        text-align: right;

        position: absolute; bottom: 0; right: 0;
        margin: .25em;
        color: white;
        /* mix-blend-mode: difference; */
      }
      #list > .item > .label::before {
        content: "";
        position: absolute;
        top: 0; left: 0;
        height: 100%; width: 100%;
        background: #000;
        color: var(--background);
      }
      #list > .item a {
        text-decoration: none;
        mix-blend-mode: difference;
      }
      #list > .item > :first-child {
        width: 100%;
        max-width: 100%;
        border: 1px solid var(--color);
        display: flex;
        max-height: calc(100vh - 1em);
      }
      #list > .item img,
      #list > .item video {
        max-width: 100%;
        width: 100%;
        height: auto;
      }
      #list > .item iframe {
        max-width: 100%;
        width: 100%;
      }
      #list > .item > .palette {
        position: absolute;
        top: 0; left: 100%; margin: 0 .5em;
      }
      
      /* Markdown content styling */
      #list > .item > .content.markdown {
        white-space: normal;
        display: block;
      }
      #list > .item > .content.markdown h1, 
      #list > .item > .content.markdown h2, 
      #list > .item > .content.markdown h3 {
        margin-top: 0.5em;
        margin-bottom: 0.25em;
        display: block;
      }
      #list > .item > .content.markdown h1 { font-size: 1.5em; font-weight: bold; }
      #list > .item > .content.markdown h2 { font-size: 1.25em; font-weight: bold; }
      #list > .item > .content.markdown h3 { font-size: 1.1em; font-weight: bold; }
      #list > .item > .content.markdown p { margin: 0.5em 0; display: block; }
      #list > .item > .content.markdown ul, 
      #list > .item > .content.markdown ol { 
        margin: 0.5em 0; 
        padding-left: 2em; 
        display: block;
      }
      #list > .item > .content.markdown li { margin: 0.25em 0; display: list-item; }
      #list > .item > .content.markdown code { 
        background: #f0f0f0; 
        padding: 0.1em 0.3em; 
        border-radius: 3px;
        font-family: inherit;
      }
      #list > .item > .content.markdown pre {
        background: #f0f0f0;
        padding: 0.5em;
        border-radius: 3px;
        overflow-x: auto;
        display: block;
      }
      #list > .item > .content.markdown pre code {
        background: none;
        padding: 0;
      }
      #list > .item > .content.markdown blockquote {
        border-left: 3px solid #ddd;
        margin: 0.5em 0;
        padding-left: 1em;
        color: #666;
        display: block;
      }
      #list > .item > .content.markdown a {
        color: #0066cc !important;
        text-decoration: underline;
        mix-blend-mode: normal !important;
      }
      #list > .item > .content.markdown a:visited {
        color: #551a8b !important;
      }
      #list > .item > .content.markdown a:hover {
        color: #003366 !important;
      }
      #list > .item > .content.markdown img {
        width: auto;
        height: auto;
        max-width: 100%;
        max-height: 400px;
        display: block;
      }
    </style>
    <script>
      const has_search = location.search.slice(2)
      Q('#floater').style.display = has_search ? '' : 'none'

      const scrollToItem = window['scrollToItem'] = (item=new URLSearchParams(location.search).get('')?.split('?')[0]) => {
        if (item) {
          const id = `item-${item.split('.')[0].replace(/\//g, '-')}`
          const element = document.querySelector(`#${id}`)
          if (element) {
            element.scrollIntoView({ block: 'start', behavior: 'instant' })
          }
        }
      }

      // Normalize URL on load: remove encoding and filter allowed params
      if (location.search) {
        const allowedKeys = new Set(['', 'tag']) // '' is for post selection
        const currentParams = {}
        const searchString = location.search.slice(1)
        let needsUpdate = false
        
        searchString.split('&').forEach(pair => {
          const eqIndex = pair.indexOf('=')
          if (eqIndex === -1) {
            const key = pair
            if (allowedKeys.has(key)) {
              currentParams[key] = ''
            } else {
              needsUpdate = true // filtering out disallowed param
            }
          } else {
            const key = pair.slice(0, eqIndex)
            if (allowedKeys.has(key)) {
              const value = pair.slice(eqIndex + 1)
              const decoded = decodeURIComponent(value)
              currentParams[key] = decoded
              if (decoded !== value) needsUpdate = true // needs decoding
            } else {
              needsUpdate = true // filtering out disallowed param
            }
          }
        })
        
        // Normalize post param
        if (currentParams['']) {
          const cleanedPost = currentParams[''].split('?')[0]
          if (cleanedPost !== currentParams['']) {
            currentParams[''] = cleanedPost
            needsUpdate = true
          }
        }
        
        if (needsUpdate) {
          const queryString = Object.entries(currentParams)
            .map(([key, value]) => key + (value ? '=' + value : ''))
            .join('&')
          history.replaceState(null, '', location.pathname + (queryString ? '?' + queryString : ''))
        }
      }

      // Helper to update URL params without encoding
      const setUrlParams = window['setUrlParams'] = (params = {}, options = {}) => {
        const { unsetAll = false, unset = [] } = options
        
        // Parse current search and decode values
        const currentParams = {}
        const searchString = location.search.slice(1)
        if (searchString) {
          searchString.split('&').forEach(pair => {
            const eqIndex = pair.indexOf('=')
            if (eqIndex === -1) {
              currentParams[pair] = ''
            } else {
              const key = pair.slice(0, eqIndex)
              const value = decodeURIComponent(pair.slice(eqIndex + 1))
              currentParams[key] = value
            }
          })
        }
        
        // Build new params
        const newParams = unsetAll ? {} : { ...currentParams }
        
        // Remove specific params
        unset.forEach(key => delete newParams[key])
        
        // Add/update new params
        Object.entries(params).forEach(([key, value]) => {
          if (value === null || value === undefined) {
            delete newParams[key]
          } else {
            newParams[key] = value
          }
        })
        
        // Build query string without encoding
        const queryString = Object.entries(newParams)
          .map(([key, value]) => key + (value ? '=' + value : ''))
          .join('&')
        
        url.replace(location.pathname + (queryString ? '?' + queryString : ''))
      }

      {
        const list = Q('#list')
        const item = new URLSearchParams(location.search).get('')?.split('?')[0]
        // Fetch all tag files dynamically
          fetch('/api/posts')
          .then(res => res.json())
          .then(async data => {
            const files = data.posts.map(p => p.path)
            
            // Fetch all config files
            const configFiles = await fetch('/api/config')
              .then(res => res.json())
              .then(data => data.files)
              .catch(e => [])
            
            // Fetch each tag file
            const tags = {}
            let backdrop = undefined
            let pins = [[], new Set()]
            let tagOrder = []
            const hideFromMain = new Set() // Items with "-" prefix in ANY tag file
            
            for (const configFile of configFiles) {
              const tagName = configFile.slice(1) // Remove leading '-'
              const content = await fetch(`/config/${configFile}`)
          .then(res => res.text())
                .then(text => text.split('\n').filter(x => x && !x.startsWith(COMMENT_PREFIX)))
                .catch(e => [])
              
              if (tagName === 'backdrop') {
                backdrop = content.filter(x => x.trim())[0]
              } else if (tagName === 'pins') {
                // Parse pins, handling "-" prefix
                const parsedPins = content.map(entry => {
                  if (entry.startsWith('-')) {
                    const path = entry.slice(1)
                    hideFromMain.add(path)
                    return path
                  }
                  return entry
                })
                pins = [parsedPins, new Set(parsedPins)]
              } else if (tagName === 'order') {
                tagOrder = content
              } else {
                // Regular tag - parse entries for "-" prefix
                const parsedEntries = content.map(entry => {
                  if (entry.startsWith('-')) {
                    const path = entry.slice(1)
                    hideFromMain.add(path)
                    return path
                  }
                  return entry
                })
                tags[tagName] = new Set(parsedEntries)
              }
            }
            
            // Items hidden from main if ANY tag file uses "-" prefix
            return { files, tags, pins, backdrop, tagOrder, hideFromMain }
          })
        .then(async ({ files, tags, pins, backdrop, tagOrder, hideFromMain }) => {
          console.debug('render file-social', {files, tags, pins, backdrop, tagOrder, hideFromMain})
          
          // Add dynamic CSS for tag filters
          const style = document.createElement('style')
          style.textContent = `
            /* Hide items marked with "-" prefix when no filter active */
            #list:not([class*="filter-"]) > .item.hide-from-main:not(.pinned) {
              display: none;
            }
            
            /* Tag filters */
            ${Object.keys(tags).map(tagName => `
            #list.filter-${tagName} > .item:not(.tag-${tagName}):not(.pinned) {
              display: none;
            }
            `).join('\n')}
          `
          document.head.appendChild(style)
          
          // Set backdrop if provided
          if (backdrop) {
            const ext = backdrop.split('.').pop().toLowerCase()
            const BACKDROP_OPACITY = 0.5
            const backdropStyles = `position: fixed; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; object-fit: cover; z-index: -1;`
            if (['jpg', 'jpeg', 'png', 'gif', 'webp'].includes(ext)) {
              const img = document.createElement('img')
              img.src = backdrop
              img.style.cssText = backdropStyles + `opacity: ${BACKDROP_OPACITY}; image-rendering: pixelated;`
              document.body.prepend(img)
            } else if (['mp4', 'webm'].includes(ext)) {
              const video = document.createElement('video')
              video.src = backdrop
              video.autoplay = true
              video.loop = true
              video.muted = true
              video.style.cssText = backdropStyles + `opacity: ${BACKDROP_OPACITY}; image-rendering: pixelated;`
              document.body.prepend(video)
            } else {
              // Treat as CSS color/gradient - set body background
              document.body.style.background = backdrop
            }
          }

          const renders = {}
          
          // Helper to render video with unmute button
          const renderVideo = (src) => {
            const videoId = `video-${src.replace(/[^a-zA-Z0-9]/g, '-')}`
            return `<div style="background: white; padding: .5em; width: 100%; box-sizing: border-box; display: flex; justify-content: flex-start;">
            <div style="position: relative; display: inline-flex;">
              <video id="${videoId}" src="${src}" loop muted playsinline webkit-playsinline autoplay style="max-height: 400px; max-width: 100%; width: auto; height: auto; object-fit: contain; cursor: pointer;" onclick="
                event.preventDefault();
                const btn = this.nextElementSibling;
                this.muted = false;
                this.controls = true;
                this.style.cursor = 'default';
                if (btn) btn.remove();
              "></video>
              <button onclick="
                const video = this.previousElementSibling;
                video.muted = false;
                video.controls = true;
                video.style.cursor = 'default';
                this.remove();
              " style="position: absolute; bottom: 1em; right: 1em; background: rgba(0,0,0,0.7); border: none; border-radius: 5px; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; cursor: pointer; color: white; padding: 0; pointer-events: auto;">
                <i class="ph-fill ph-speaker-simple-x" style="font-size: 22px;"></i>
              </button>
            </div>
          </div>`
          }
          
          // Add list header with filters
          // Sort tags based on order file
          const tagNames = Object.keys(tags)
          const orderedTags = tagOrder.length > 0 
            ? [...tagOrder.filter(t => tagNames.includes(t)), ...tagNames.filter(t => !tagOrder.includes(t))]
            : tagNames
          
          const tagButtons = orderedTags.map(tagName => `
            <button data-tag="${tagName}" onclick="
              const list = Q('#list')
              const btn = event.target
              const tag = btn.dataset.tag
              const filterClass = 'filter-' + tag
              
              if (btn.classList.contains('active')) {
                // Unclick - remove filter
                btn.classList.remove('active')
                list.classList.remove(filterClass)
                setUrlParams({}, { unset: ['tag'] })
              } else {
                // Click - add filter
                QQ('#list-header button').forEach(b => b.classList.remove('active'))
                list.className = ''
                btn.classList.add('active')
                list.classList.add(filterClass)
                setUrlParams({ tag })
              }
              
              // Trigger lazy loading for newly visible items after layout updates
              requestAnimationFrame(() => {
                if (window.handleScroll) window.handleScroll()
              })
            ">${tagName}</button>
          `).join('')
          
          list.innerHTML = `
            <div id="list-header">
              <span>^PINNED</span>
              ${tagButtons}
            </div>
          `
          
          // Pre-process .url files
          const processedFiles = await Promise.all(files
            .filter(file => !file.startsWith(METADATA_PREFIX))
            .map(async file => {
              if (file.endsWith('.url')) {
                try {
                  const response = await fetch(`/posts/${file}`)
                  const url = (await response.text()).trim()
                  return { file, url }
                } catch {
                  return { file, url: null }
                }
              }
              return { file, url: null }
            })
          )

          list.innerHTML += processedFiles
            .map(({ file, url }) => {
              const path = `/posts/${file}`
              // Extract name and extension, handling files without extensions
              const lastDotIndex = file.lastIndexOf('.')
              const lastSlashIndex = file.lastIndexOf('/')
              const hasExtension = lastDotIndex > lastSlashIndex && lastDotIndex > 0
              const extension = hasExtension ? file.substring(lastDotIndex) : ''
              const name = hasExtension ? file.substring(0, lastDotIndex) : file

              // Helper to render by extension
              const renderByExtension = (src, ext) => {
                switch (ext.toLowerCase()) {
                case '.png': case '.jpg': case '.jpeg': case '.gif': case '.webp':
                    return `<div style="background: white; padding: .5em; width: 100%; box-sizing: border-box; display: flex; justify-content: flex-start;"><img src="${src}" style="max-height: 400px; max-width: 100%; width: auto; height: auto; object-fit: contain;" /></div>`
                  case '.mp4': case '.webm':
                    return renderVideo(src)
                  case '.glb': case '.gltf':
                    return `<div style="background: white; padding: .5em; width: 100%; box-sizing: border-box; display: flex; justify-content: center;">
                      <model-viewer 
                        src="${src}" 
                        alt="3D model" 
                        auto-rotate 
                        camera-controls 
                        loading="eager"
                        interaction-prompt="none"
                        style="width: 100%; height: 400px; --poster-color: transparent; --progress-bar-height: 0; user-select: none; -webkit-user-select: none;"
                        exposure="1"
                        shadow-intensity="1">
                      </model-viewer>
                    </div>`
                  case '.pdf':
                    return `<div style="background: white; padding: .5em; width: 100%; box-sizing: border-box;">
                      <embed src="${src}" type="application/pdf" style="width: 100%; height: 600px; border: none;" />
                    </div>`
                  case '.html': case '.htm':
                    return `<iframe src="${src}" sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms" onload="
                  const L = event.target
                  let prev_height = undefined
                  const resize = () => {
                    try {
                      if (!L.contentWindow || !L.contentWindow.document) return false
                      
                      // Preserve scroll position through entire resize operation
                      const scrollBefore = window.scrollY
                      
                      L.height = 400
                      L.height = L.contentWindow.document.documentElement.scrollHeight + 20
                      const min400 = L.height
                      L.height = 0
                      L.height = L.contentWindow.document.documentElement.scrollHeight + 20
                      const min0 = L.height
                      const height = min0 <= 20 ? min400 : min0
                      const changed = height !== prev_height
                      prev_height = height
                      
                      // Restore scroll IMMEDIATELY after all height changes
                      const scrollAfter = window.scrollY
                      if (Math.abs(scrollAfter - scrollBefore) > 1) {
                        window.scrollTo(0, scrollBefore)
                      }
                      
                      return changed
                    } catch(e) {
                      L.height = 400 + 20
                      return false
                    }
                  }
                    setTimeout(() => resize(), 100)
                    const resizeInterval = setInterval(() => resize(), 1_000)
                    L.addEventListener('unload', () => clearInterval(resizeInterval))
                    "></iframe>`
                  default:
                    // Unknown extension for URL content - try as iframe
                    return `<div style="background: white; min-height: 15em;"><iframe src="${src}" sandbox="allow-same-origin allow-scripts allow-popups allow-popups-to-escape-sandbox allow-forms" style="width: 100%; height: 500px; border: none;"></iframe></div>`
                }
              }

              // Handle .url files with pre-fetched URL
              if (extension.toLowerCase() === '.url' && url) {
                const lastDot = url.lastIndexOf('.')
                const lastSlash = url.lastIndexOf('/')
                // If no extension or extension before last slash, treat as HTML
                const urlExt = (lastDot > lastSlash && lastDot !== -1) 
                  ? url.substring(lastDot).toLowerCase().split('?')[0]
                  : '.html'
                return renderByExtension(url, urlExt)
              }
              
              switch (extension.toLowerCase()) {
                case '.url':
                  // Fallback if URL fetch failed
                  return `<div class='content'>Error loading URL file</div>`
                case '.png': case '.jpg': case '.jpeg': case '.gif': case '.webp':
                case '.mp4': case '.webm':
                case '.glb': case '.gltf':
                case '.pdf':
                case '.html': case '.htm': case '.href.txt':
                  return renderByExtension(path, extension)
                case '.md':
                  // Markdown files - render as HTML
                  const mdContentId = `content-${name.replace(/[^a-zA-Z0-9]/g, '-')}`
                  return {
                    html: `<div class='content markdown' id="${mdContentId}" style="background: white; padding: .5em;">[loading...]</div>`,
                    load: async () => {
                      try {
                        const res = await fetch(path)
                        const text = await res.text()
                        const el = document.getElementById(mdContentId)
                        if (el && window.marked) {
                          // Configure marked to open links in new tab
                          const renderer = new marked.Renderer()
                          const originalLinkRenderer = renderer.link
                          renderer.link = function(href, title, text) {
                            const html = originalLinkRenderer.call(this, href, title, text)
                            return html.replace(/^<a /, '<a target="_blank" rel="noopener noreferrer" ')
                          }
                          el.innerHTML = marked.parse(text, { renderer })
                        }
                      } catch (e) {
                        const el = document.getElementById(mdContentId)
                        if (el) el.textContent = '[error loading file]'
                      }
                    }
                  }
                case '.txt':
                default:
                  // For text files, render directly as text content
                  const contentId = `content-${name.replace(/[^a-zA-Z0-9]/g, '-')}`
                  // Store fetcher for lazy loading
                  return {
                    html: `<div class='content' id="${contentId}">[loading...]</div>`,
                    load: async () => {
                      try {
                        const res = await fetch(path)
                        const text = await res.text()
                        const el = document.getElementById(contentId)
                        if (el) el.textContent = text
                      } catch (e) {
                        const el = document.getElementById(contentId)
                        if (el) el.textContent = '[error loading file]'
                      }
                    }
                  }
              }
            })
            .flatMap((render, i) => {
              const encoded = processedFiles[i].file
              const url = processedFiles[i].url
              const name = decodeURIComponent(encoded)
              const socials = (window['stream-item-socials'] || {})[name]

              const id = `item-${encoded.split('.')[0].replace(/\//g, '-')}`
              const pinned = pins[1].has(name)
              
              // For .url files, use the actual URL for "new tab" link
              const newTabHref = url || `${location.origin}/posts/${name}`
              
              // Check all tags for this item
              const itemTags = Object.keys(tags).filter(tagName => tags[tagName].has(name))
              itemTags.length && log({name, tags: itemTags, pinned})
              
              // Generate item HTML helper
              const createItemHTML = (isPinnedVersion) => {
                let load_on_scroll_into_view
                const itemId = isPinnedVersion ? `${id}-pinned` : id
                
                // Handle object return (text files with lazy loader)
                if (typeof render === 'object' && render.html) {
                  if (!isPinnedVersion) renders[itemId] = render
                  if (pinned && isPinnedVersion) {
                    load_on_scroll_into_view = render.html
                    render.load() // Load immediately for pinned
                  } else if (pinned && !isPinnedVersion) {
                    // Unpinned copy uses lazy loading
                    load_on_scroll_into_view = `<div class='render-target content'></div>`
                    renders[itemId] = render
                  } else {
                    load_on_scroll_into_view = `<div class='render-target content'></div>`
                  }
                } else if (pinned && isPinnedVersion) {
                  load_on_scroll_into_view = render
                } else {
                  if (!isPinnedVersion) renders[itemId] = render
                  load_on_scroll_into_view = `<div class='render-target content'></div>`
                }
                
                const itemPinned = pinned && isPinnedVersion
                const shouldHideFromMain = hideFromMain.has(name) && !itemPinned
                const itemTagClasses = [
                  ...itemTags.map(t => `tag-${t}`),
                  itemPinned ? 'pinned' : '',
                  shouldHideFromMain ? 'hide-from-main' : ''
                ].filter(Boolean).join(' ')
                
                return `
            <div class="item ${itemTagClasses}" id="${itemId}" style="
            order: ${itemPinned ? -(pins[0].length - pins[0].indexOf(encoded)) : i * 2};
            ${itemPinned ? `
            margin-top: -1px !important;
            padding-top: 0 !important;
            ` : ''}
            ">
              ${name.includes('rated-R')
              ? `<div style="
              background: #fff;
              ">
                <button style="
                margin: .5em 1em;
                cursor: pointer;
                " onclick="
                console.debug(event)
                event.target.parentNode.parentNode.prepend(event.target.nextElementSibling.children[0])
                event.target.parentNode.remove()
                ">RATED R</button>
                <div style="display:none">
                  ${load_on_scroll_into_view}
                </div>
              </div>`
              : load_on_scroll_into_view}
              ${
                `<div class="label hidden" style="
                bottom: 1.5em;
                ${item === name ? '' : 'display: none;'}
                "><a target="_blank" href="${newTabHref}">new tab ↗</a></div>`
              }
              <div class="label">${
                `<a href="#" data-post="${encoded}" onclick="
                const e = event
                const { currentTarget:l } = e
                if (!e.metaKey) {
                  e.preventDefault()
                  
                  // Parse current params
                  const currentParams = {}
                  const searchString = location.search.slice(1)
                  if (searchString) {
                    searchString.split('&').forEach(pair => {
                      const [key, ...valueParts] = pair.split('=')
                      currentParams[key] = valueParts.join('=') || ''
                    })
                  }
                  
                  const currentPost = currentParams[''] || ''
                  const clickedPost = l.dataset.post
                  const show_new_tab = currentPost !== clickedPost
                  
                  if (show_new_tab) {
                    setUrlParams({ '': clickedPost })
                  } else {
                    setUrlParams({}, { unset: [''] })
                  }
                  
                  let item = l
                  while (item && !item.classList?.contains('item')) {
                    item = item.parentNode
                  }

                  document.title = 'file-social'
                  QQ('.label.hidden').map(x => x.style.display = 'none')

                  if (show_new_tab) {
                    QQ(item, '.label').map(x => x.style.display = 'unset')
                    document.title = '${name}'
                    Q('#floater').style.display = ''
                  } else {
                    Q('#floater').style.display = 'none'
                  }
                }
                ">${name}</a>`
              }</div>
              ${
                socials ? `<div class=row style="
                position: absolute;
                bottom: 0; left: 0; margin: 2px;
                ">${
                  socials.map(([object, args]) => object.render(...args.render)).map(x => `<div class=label style="
                  color: #fff; height: 1em;
                  ">${x}</div>`).join('')
                }</div>` : ''
              }
            </div>`
              }
              
              // Return array: pinned posts appear twice (pinned + normal), regular posts once
              if (pinned) {
                return [createItemHTML(true), createItemHTML(false)]
              } else {
                return [createItemHTML(false)]
              }
            })
            .join('\n')

          // Set up IntersectionObserver for video autoplay (fallback for mobile)
          const setupVideoObservers = () => {
            const videos = QQ(list, 'video[id^="video-"]')
            const videoObserver = new IntersectionObserver((entries) => {
              entries.forEach(entry => {
                const video = entry.target
                if (entry.isIntersecting) {
                  video.play().catch(() => {})
                } else {
                  video.pause()
                }
              })
            }, { threshold: 0.5 })
            
            videos.forEach(video => videoObserver.observe(video))
          }
          
          // Initial setup
          setupVideoObservers()

          // Handle initial selection from URL
          if (item) {
            const selectedId = `item-${item.split('.')[0].replace(/\//g, '-')}`
            const selectedItem = document.querySelector(`#${selectedId}`)
            if (selectedItem) {
              QQ(selectedItem, '.label').forEach(label => label.style.display = 'unset')
              document.title = item
            }
          }

          // Apply tag filter from URL if present
          const currentParams = {}
          const searchString = location.search.slice(1)
          if (searchString) {
            searchString.split('&').forEach(pair => {
              const eqIndex = pair.indexOf('=')
              if (eqIndex === -1) {
                currentParams[pair] = ''
              } else {
                const key = pair.slice(0, eqIndex)
                const value = pair.slice(eqIndex + 1)
                currentParams[key] = value
              }
            })
          }
          
          const tagFromUrl = currentParams['tag']
          if (tagFromUrl && tags[tagFromUrl]) {
            const btn = Q(`#list-header button[data-tag="${tagFromUrl}"]`)
            if (btn) {
              btn.classList.add('active')
              list.classList.add(`filter-${tagFromUrl}`)
              // Trigger lazy loading after filter is applied
              requestAnimationFrame(() => handleScroll())
            }
          }

          let user_scroll = false
          let start_ms = performance.now()
          
          // Track scroll state to prevent unload during active scrolling
          let isScrolling = false
          let scrollTimeout
          window.isActivelyScrolling = () => isScrolling
          
          // Track scroll jumps
          let lastScrollY = window.scrollY
          window.addEventListener('scroll', () => {
            isScrolling = true
            clearTimeout(scrollTimeout)
            scrollTimeout = setTimeout(() => {
              isScrolling = false
            }, 150)
            
            requestAnimationFrame(() => {
              lastScrollY = window.scrollY
            })
          }, { passive: true })
          
          // Use IntersectionObserver for efficient lazy loading
          const loadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              if (entry.isIntersecting) {
                const item = entry.target
                const render_target = Q(item, '.render-target')
                
                if (render_target) {
                  const renderData = renders[item.id]
                  if (renderData) {
                    try {
                    if (typeof renderData === 'object' && renderData.html) {
                      render_target.outerHTML = renderData.html
                      renderData.load()
                    } else {
                      render_target.outerHTML = renderData
                    }
                      setupVideoObservers()
                      delete renders[item.id]
                      loadObserver.unobserve(item)
                  } catch {}
                  }
                }
              }
            })
          }, { rootMargin: '200% 0px' })
              
          // Use IntersectionObserver for unloading far items
          const unloadObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
              const item = entry.target
              
              // Allow RELOAD during scroll (it's loading content back in)
              // But block UNLOAD during scroll (it modifies existing layout)
              if (!entry.isIntersecting && !item.dataset.unloaded) {
                // UNLOAD - skip if scrolling or if item is pinned
                if (isScrolling) return
                if (item.classList.contains('pinned')) return
                
                // Unload item that's far away
                const rect = item.getBoundingClientRect()
                const itemHeight = rect.height
                const labels = Array.from(item.querySelectorAll('.label')).map(l => l.outerHTML).join('')
                
                item.dataset.unloaded = 'true'
                item.dataset.savedContent = item.innerHTML
                item.dataset.savedHeight = itemHeight
                
                // Set BOTH height and minHeight to lock the size exactly
                item.style.height = itemHeight + 'px'
                item.style.minHeight = itemHeight + 'px'
                item.style.maxHeight = itemHeight + 'px'
                // Replace with empty placeholder that doesn't add any extra spacing
                item.innerHTML = `<div style="width: 100%; height: 100%; background: white; border: 1px solid var(--color);"></div>${labels}`
              } else if (entry.isIntersecting && item.dataset.unloaded === 'true') {
                // Reload item when scrolling back
                item.innerHTML = item.dataset.savedContent
                // Clear the locked height
                item.style.height = ''
                item.style.minHeight = ''
                item.style.maxHeight = ''
                delete item.dataset.unloaded
                setupVideoObservers()
              }
            })
          }, { rootMargin: '300% 0px' })
          
          // Observe all items
          const observeItems = () => {
            QQ(list, '.item').forEach(item => {
              loadObserver.observe(item)
              unloadObserver.observe(item)
            })
          }
          
          const handleScroll = window['handleScroll'] = () => {
            if (performance.now() - start_ms > 250) user_scroll = true
            
            // Only disconnect/reconnect when tags change, not during normal scroll
            // This was causing unload/reload cycles during scrolling
          }
          
          observeItems()

          // Set up iframe event listeners (for both immediate and lazy-loaded iframes)
          const setupIframeLinks = (frame) => {
            frame.addEventListener('load', () => {
              try {
                const links = Array.from(frame.contentWindow.window.document.querySelectorAll('a[href]'))
                links.map(link => link.addEventListener('click', e => {
                  if (!link.href.startsWith(location.origin)) {
                    e.preventDefault()
                    e.stopPropagation()
                    window.open(link.href, '_blank')
                  }
                }))
              } catch {}
            })
          }
          
          // Set up existing iframes (pinned items)
          Array.from(list.querySelectorAll('iframe')).forEach(setupIframeLinks)
          
          // Set up MutationObserver to handle lazy-loaded iframes
          const iframeObserver = new MutationObserver((mutations) => {
            mutations.forEach((mutation) => {
              mutation.addedNodes.forEach((node) => {
                if (node.nodeName === 'IFRAME') {
                  setupIframeLinks(node)
                }
              })
            })
          })
          iframeObserver.observe(list, { childList: true, subtree: true })

          // Keyboard navigation with tracked position
          let lastNavigatedItem = null
          let isNavigating = false
          
          // Clear navigation tracking on manual scroll
          on(window, 'scroll', () => {
            if (!isNavigating) {
              lastNavigatedItem = null
            }
          })
          
          on(window, 'keydown', (e) => {
            // Only navigate visible items (not CSS-hidden by tag filters)
            const allItems = QQ('#list > .item')
            const items = Array.from(allItems).filter(item => item.offsetParent !== null)
            if (!items.length) return
            
            // Find current index
            let currentIndex = 0
            
            if (lastNavigatedItem && items.includes(lastNavigatedItem)) {
              // Use last navigated item if it's still visible
              currentIndex = items.indexOf(lastNavigatedItem)
            } else {
              // Otherwise find item closest to viewport top
              let minDistance = Infinity
              items.forEach((item, index) => {
                const rect = item.getBoundingClientRect()
                const distance = Math.abs(rect.top)
                if (distance < minDistance) {
                  minDistance = distance
                  currentIndex = index
                }
              })
            }
            
            // Navigate with arrow keys
            if (e.key === 'ArrowDown' || e.key === 'j') {
              e.preventDefault()
              const nextIndex = Math.min(currentIndex + 1, items.length - 1)
              lastNavigatedItem = items[nextIndex]
              isNavigating = true
              items[nextIndex]?.scrollIntoView({ behavior: 'smooth', block: 'start' })
              setTimeout(() => isNavigating = false, 500)
            } else if (e.key === 'ArrowUp' || e.key === 'k') {
              e.preventDefault()
              const prevIndex = Math.max(currentIndex - 1, 0)
              lastNavigatedItem = items[prevIndex]
              isNavigating = true
              items[prevIndex]?.scrollIntoView({ behavior: 'smooth', block: 'start' })
              setTimeout(() => isNavigating = false, 500)
            } else if (e.key === 'Home') {
              e.preventDefault()
              lastNavigatedItem = items[0]
              isNavigating = true
              items[0]?.scrollIntoView({ behavior: 'smooth', block: 'start' })
              setTimeout(() => isNavigating = false, 500)
            } else if (e.key === 'End') {
              e.preventDefault()
              lastNavigatedItem = items[items.length - 1]
              isNavigating = true
              items[items.length - 1]?.scrollIntoView({ behavior: 'smooth', block: 'start' })
              setTimeout(() => isNavigating = false, 500)
            }
          })
        })

      }
    </script>
  </div>

</body>
</html>
